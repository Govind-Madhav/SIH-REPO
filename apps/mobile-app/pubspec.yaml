name: ner_logistics_mobile
description: "North East Region (NER) AI-Powered Smart Logistics & Accessibility Mobile Application (Driver App & Field Officer App)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  path: ^1.9.0
  connectivity_plus: ^5.0.2
  uuid: ^4.3.3
  intl: ^0.19.0
  stomp_dart_client: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
