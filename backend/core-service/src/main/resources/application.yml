server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: core-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ner_logistics}
    username: ${DB_USER:sih_admin}
    password: ${DB_PASSWORD:sih_secure_password_2026}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: ner-logistics-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: dGhpcy1pcy1hLXNlY3VyZS0yNTYtYml0LXNlY3JldC1rZXktZm9yLXNpLWxvZ2lzdGljcy0yMDI2
  expiration-ms: 86400000

cors:
  allowed-origins: "http://localhost:5173,http://localhost:3000"

ml:
  prediction:
    enabled: false
    base-url: http://localhost:8000
    timeout: 5000

risk:
  predictive:
    critical-threshold: 0.80
    high-threshold: 0.60
    medium-threshold: 0.30
